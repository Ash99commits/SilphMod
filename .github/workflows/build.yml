name: Build SilphMod APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK r28c (28.2.13676358)
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          { yes || true; } | "$SDKMANAGER" --licenses > /dev/null 2>&1
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (ready to install on UGPhone)
        env:
          SILPH_RAID_API: ${{ vars.SILPH_RAID_API }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: silphmod-debug-apk
          path: app/build/outputs/apk/debug/*.apk
